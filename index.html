<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloomsbury Safeguarding – Slideshow</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="color-scheme" content="dark light">
</head>
<body>
  <div class="container">
    <section class="banner" aria-label="Site banner">
      <div class="weather" id="weather" aria-live="polite">
        <span id="weather-icon" aria-hidden="true">🌡️</span>
        <span class="temp" id="weather-temp">--°C</span>
        <span class="desc" id="weather-desc">Loading...</span>
        <span class="desc" id="weather-location"></span>
        <ol id="weather-hours" class="weather-hours" aria-label="Next 5 hours"></ol>
      </div>

      <div class="warnings" id="warnings" aria-live="polite">
        <div class="warnings-empty">No active weather warnings.</div>
        <ol class="warnings-list" id="warnings-list" hidden></ol>
      </div>
    </section>

    <!--
      The markup below is the FALLBACK, not a placeholder: Peter and the
      hotline are what shows before app.js runs, and what it puts back if the
      coach app can't be reached or nobody is on the DSL rota today. Never
      blank it out — a safeguarding screen showing no contact is worse than
      one showing the general escalation route.

      app.js swaps only the face, the name and the role, from the DSL rota
      Pete keeps in the coach app (Safeguarding → DSL rota). The number is
      deliberately fixed: it is the hotline, not the on-duty person's mobile.
    -->
    <section class="contact-card" id="contact-card" aria-label="Safeguarding contact">
      <img id="contact-photo" src="assets/images/peter.jpg" alt="Headshot of Peter Marment" width="64" height="64" loading="eager">
      <div class="contact-meta">
        <span class="name" id="contact-name">Peter Marment</span>
        <span class="role" id="contact-role">Head of Safeguarding</span>
      </div>
      <div class="contact-actions">
        <span class="phone-label">DSL Hotline:</span>
        <a class="btn" href="tel:+447700174021" aria-label="Call DSL Hotline +44 7700 174021">+44 7700 174021</a>
      </div>
    </section>

    <!-- Full-bleed slideshow fills remaining viewport space -->
    <section class="slideshow" id="slideshow" aria-label="Canva slideshow">
      <div class="slide-layer" id="layerA" aria-hidden="true">
        <img id="slideA" class="slide-img" alt="Slide">
      </div>
      <div class="slide-layer" id="layerB" aria-hidden="true">
        <img id="slideB" class="slide-img" alt="Slide">
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
